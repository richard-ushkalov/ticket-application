<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

        <title>Menu — Rigas Satiksme</title>

        <meta name="theme-color" content="#07063E">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="Satiksme">
        <link rel="manifest" href="manifest.webmanifest">
        <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">

        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="layout">
            <div class="header">
                <a class="header__home" href="index.html" aria-label="Home">
                    <img class="header__logo" src="img/rigas-satiksme-logo.png" alt="Rigas Satiksme Logo">
                </a>
                <button type="button" class="header__logout" aria-label="Log out">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
                    </svg>
                </button>
            </div>

            <nav class="menu">
                <a class="menu__item" href="index.html">
                    <span class="menu__icon">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor" d="M22 10V6c0-1.11-.9-2-2-2H4c-1.1 0-1.99.89-1.99 2v4c1.1 0 1.99.9 1.99 2s-.89 2-2 2v4c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c-1.1 0-2-.9-2-2s.9-2 2-2zm-9 7.5h-2v-2h2v2zm0-4.5h-2v-2h2v2zm0-4.5h-2v-2h2v2z"/>
                        </svg>
                    </span>
                    <span class="menu__label">TICKETS</span>
                </a>
                <a class="menu__item" href="#">
                    <span class="menu__icon">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <!-- маска вырезает строки и стрелки часов, остаётся зелёный лист + часы -->
                            <mask id="schedule-mask">
                                <rect width="24" height="24" fill="white"/>
                                <path d="M6.5 7h7M6.5 10.5h7M6.5 14h3" stroke="black" stroke-width="1.6" stroke-linecap="round"/>
                                <circle cx="17" cy="17" r="6.2" fill="black"/>
                                <circle cx="17" cy="17" r="4.8" fill="white"/>
                                <path d="M17 14.6V17l1.6 1" fill="none" stroke="black" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                            </mask>
                            <g fill="currentColor" mask="url(#schedule-mask)">
                                <rect x="3" y="2.5" width="14" height="18" rx="2"/>
                                <circle cx="17" cy="17" r="4.8"/>
                            </g>
                        </svg>
                    </span>
                    <span class="menu__label">ROUTES AND SCHEDULES</span>
                </a>
                <a class="menu__item" href="#">
                    <span class="menu__icon">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor" fill-rule="evenodd" d="M6 3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zm2 3.5h4.7a3.7 3.7 0 0 1 0 7.4h-2.1v3.6H8zm2.6 2.3h2.1a1.4 1.4 0 0 1 0 2.8h-2.1z"/>
                        </svg>
                    </span>
                    <span class="menu__label">PARKING</span>
                </a>
            </nav>

            <div class="footer">
                <button class="footer__my-profile button button--action">MY PROFILE</button>
                <span class="footer__contacts text">
                    Informative phone
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="currentColor" d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
                    </svg>
                    <a class="link" href="tel:20361862">20361862</a>
                </span>
                <span class="footer__version text">Version 2.1.1</span>
            </div>
        </div>
    </body>
</html>
