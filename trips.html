<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

        <title>History of trips — Rigas Satiksme</title>

        <meta name="theme-color" content="#07063E">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="Satiksme">
        <link rel="manifest" href="manifest.webmanifest">
        <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">

        <link rel="stylesheet" href="style.css">
        <script src="common.js"></script>
        <script src="trips.js" defer></script>
    </head>
    <body>
        <!-- layout--screen: страница ровно в экран, прокручивается только таблица -->
        <div class="layout layout--screen">
            <div class="page-header">
                <a class="page-header__back" href="my-tickets.html" data-back aria-label="Back">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m15 18-6-6 6-6"/>
                    </svg>
                </a>
                <h1 class="page-header__title text">HISTORY OF TRIPS</h1>
            </div>

            <label class="field period">
                <svg class="icon period__icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2zm-8 4H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z"/>
                </svg>
                <span class="visually-hidden">Period</span>
                <select class="field__select period__select">
                    <option value="7">1 WEEK</option>
                    <option value="30" selected>1 MONTH</option>
                    <option value="90">3 MONTHS</option>
                </select>
                <svg class="icon field__caret" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M7 10l5 5 5-5z"/>
                </svg>
            </label>

            <div class="table-scroll">
                <table class="table table--lines">
                    <colgroup>
                        <col style="width: 36%">
                        <col style="width: 44%">
                        <col style="width: 20%">
                    </colgroup>
                    <thead>
                        <tr>
                            <th scope="col">DATE</th>
                            <th scope="col">TICKET ID</th>
                            <th scope="col">QR ID</th>
                        </tr>
                    </thead>
                    <tbody class="trips"></tbody>
                </table>
            </div>

            <div class="footer footer--compact">
                <button type="button" class="button">LAST REGISTRATION</button>
            </div>
        </div>
    </body>
</html>
